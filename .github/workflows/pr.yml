# https://nektosact.com/usage/index.html
name: On PR
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.22
      - run: npm ci
        env:
            NODE_AUTH_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}
      - run: bs/dev/lint.js

  test-unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.22
      - run: npm ci
        env:
            NODE_AUTH_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}
      - run: bs/test/unit.js
        env:
          CI: 'true'

  test-e2e:
    name: E2E Tests
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.22
      - run: npm ci
        env:
            NODE_AUTH_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}
      - run: npx playwright install --with-deps
      - run: bs/test/e2e.js
        env:
          CI: 'true'
